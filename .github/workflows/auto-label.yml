name: Auto Label

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label by keywords
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const isPr = !!context.payload.pull_request;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();

            const labelsToAdd = new Set();
            const labelsToRemove = new Set();

            const hasLabel = (name) => (issue.labels || []).some(l => l.name === name);

            // ── Bug / Fix ──
            if (title.includes('bug') || title.includes('fix') || title.includes('hotfix') || body.includes('bug report')) {
              labelsToAdd.add('bug');
            }

            // ── Feature / Enhancement ──
            if (title.includes('feat') || title.includes('feature') || title.includes('enhancement') || title.startsWith('add ')) {
              labelsToAdd.add('feature');
            }

            // ── Documentation ──
            if (title.includes('doc') || title.includes('readme') || title.includes('wiki') || title.includes('comment')) {
              labelsToAdd.add('documentation');
            }

            // ── Refactor ──
            if (title.includes('refactor') || title.includes('cleanup') || title.includes('clean up') || title.includes('restructure')) {
              labelsToAdd.add('refactor');
            }

            // ── Breaking Change ──
            if (title.includes('break') || title.includes('breaking') || title.includes('bc break') || title.includes('!')) {
              labelsToAdd.add('breaking');
            }

            // ── Chore / CI / Build ──
            if (title.includes('chore') || title.includes('ci') || title.includes('workflow') || title.includes('build') || title.includes('deps') || title.includes('bump')) {
              labelsToAdd.add('chore');
            }

            // ── Performance ──
            if (title.includes('perf') || title.includes('performance') || title.includes('slow') || title.includes('speed') || title.includes('memory') || title.includes('cache')) {
              labelsToAdd.add('performance');
            }

            // ── Security ──
            if (title.includes('security') || title.includes('vulnerability') || title.includes('cve') || title.includes('xss') || title.includes('injection') || title.includes('auth')) {
              labelsToAdd.add('security');
            }

            // ── Good first issue ──
            if (title.includes('good first issue') || title.includes('beginner') || title.includes('easy') || title.includes('first-time')) {
              labelsToAdd.add('good first issue');
            }

            // ── UI / UX ──
            if (title.includes('ui') || title.includes('ux') || title.includes('design') || title.includes('tailwind') || title.includes('css') || title.includes('style')) {
              labelsToAdd.add('ui/ux');
            }

            // ── Database ──
            if (title.includes('migration') || title.includes('database') || title.includes('eloquent') || title.includes('seed') || title.includes('schema')) {
              labelsToAdd.add('database');
            }

            // ── API ──
            if (title.includes('api') || title.includes('endpoint') || title.includes('route') || title.includes('controller')) {
              labelsToAdd.add('api');
            }

            // ── Testing ──
            if (title.includes('test') || title.includes('spec') || title.includes('pest') || title.includes('phpunit') || title.includes('coverage')) {
              labelsToAdd.add('tests');
            }

            // ── Docker ──
            if (title.includes('docker') || title.includes('container') || title.includes('image') || title.includes('dockerfile')) {
              labelsToAdd.add('docker');
            }

            // ── Priority ──
            if (title.includes('urgent') || title.includes('critical') || title.includes('emergency') || title.includes('blocker')) {
              labelsToAdd.add('priority: high');
            }

            if (title.includes('low priority') || title.includes('nice to have')) {
              labelsToAdd.add('priority: low');
            }

            // ── PR-specific: file path labels ──
            if (isPr) {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });

              const paths = files.map(f => f.filename);

              const touched = (patterns) => paths.some(p => patterns.some(pat => p.includes(pat)));

              if (touched(['resources/js', 'resources/css', 'vite.config', 'package.json', 'tailwind.config'])) {
                labelsToAdd.add('frontend');
              }

              if (touched(['app/', 'routes/', 'config/', 'bootstrap/', 'composer.json'])) {
                labelsToAdd.add('backend');
              }

              if (touched(['.github/workflows', '.github/actions'])) {
                labelsToAdd.add('ci/cd');
              }

              if (touched(['docker/', 'Dockerfile', 'docker-compose'])) {
                labelsToAdd.add('docker');
              }

              if (touched(['tests/', 'phpunit', 'pest'])) {
                labelsToAdd.add('tests');
              }

              if (touched(['database/migrations', 'database/seeders', 'database/factories'])) {
                labelsToAdd.add('database');
              }

              if (touched(['resources/views', 'blade', 'filament'])) {
                labelsToAdd.add('ui/ux');
              }
            }

            const add = Array.from(labelsToAdd).filter(l => !hasLabel(l));

            if (add.length > 0) {
              core.info(`Adding labels: ${add.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: add,
              });
            } else {
              core.info('No new labels to add.');
            }

      - name: Normalize pull request title
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const currentTitle = (pull.title || '').trim();
            const conventionalPattern = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+/;

            if (conventionalPattern.test(currentTitle)) {
              core.info(`PR title is already conventional: ${currentTitle}`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            });

            const paths = files.map((file) => file.filename);
            const labelNames = new Set(labels.map((label) => label.name.toLowerCase()));
            const text = `${currentTitle}\n${pull.body || ''}`.toLowerCase();
            const existing = currentTitle.match(
              /^(feat(?:ure)?|enhancement|fix|bug(?:fix)?|hotfix|perf(?:ormance)?|refactor|docs?|documentation|tests?|build|ci|chore|revert|style)(?:\(([A-Za-z0-9._/-]+)\))?(!)?\s*[:\-]\s*/i,
            );
            const aliases = {
              feat: 'feat',
              feature: 'feat',
              enhancement: 'feat',
              fix: 'fix',
              bug: 'fix',
              bugfix: 'fix',
              hotfix: 'fix',
              perf: 'perf',
              performance: 'perf',
              refactor: 'refactor',
              doc: 'docs',
              docs: 'docs',
              documentation: 'docs',
              test: 'test',
              tests: 'test',
              build: 'build',
              ci: 'ci',
              chore: 'chore',
              revert: 'revert',
              style: 'style',
            };

            const allPathsMatch = (pattern) =>
              paths.length > 0 && paths.every((path) => pattern.test(path));
            const anyPathMatches = (pattern) => paths.some((path) => pattern.test(path));
            const hasAnyLabel = (...names) => names.some((name) => labelNames.has(name));

            let type = existing ? aliases[existing[1].toLowerCase()] : '';
            if (!type) {
              if (
                hasAnyLabel('bug', 'security') ||
                /\b(fix|bug|hotfix|regression|security|vulnerability|cve)\b/.test(text)
              ) {
                type = 'fix';
              } else if (
                hasAnyLabel('performance') ||
                /\b(performance|optimi[sz]e|faster|speed|latency|memory)\b/.test(text)
              ) {
                type = 'perf';
              } else if (
                hasAnyLabel('refactor') ||
                /\b(refactor|restructure|cleanup|clean up)\b/.test(text)
              ) {
                type = 'refactor';
              } else if (
                hasAnyLabel('documentation') ||
                /\b(documentation|docs?|readme|guide|handbook)\b/.test(text) ||
                allPathsMatch(/^(docs\/|[^/]*\.md$)/)
              ) {
                type = 'docs';
              } else if (
                hasAnyLabel('tests') ||
                /\b(test|tests|testing|pest|phpunit|coverage)\b/.test(text) ||
                allPathsMatch(/^tests\//)
              ) {
                type = 'test';
              } else if (
                hasAnyLabel('ci/cd') ||
                /\b(ci\/cd|continuous integration|github actions?|workflow|release please|pr title|pull request title)\b/.test(text) ||
                allPathsMatch(/^\.github\//)
              ) {
                type = 'ci';
              } else if (
                /\b(dependenc(?:y|ies)|dependabot|composer|npm|build|dockerfile|base image)\b/.test(text) ||
                allPathsMatch(/(^|\/)(composer\.(json|lock)|package(-lock)?\.json|Dockerfile)$/)
              ) {
                type = 'build';
              } else if (
                hasAnyLabel('feature', 'enhancement') ||
                /\b(add|create|enable|feature|implement|introduce|support|improve|revamp)\b/.test(text)
              ) {
                type = 'feat';
              } else {
                type = 'chore';
              }
            }

            const scopeRules = [
              ['release', /\b(release|version|semver|changelog)\b/i],
              ['actions', /\b(github actions?|workflow|ci\/cd|continuous integration|pr title|pull request title)\b/i],
              ['deps', /\b(dependenc(?:y|ies)|dependabot|composer|npm package)\b/i],
              ['installer', /\b(installer|install script|setup script)\b/i],
              ['docker', /\b(docker|container|compose|image registry)\b/i],
              ['enrollments', /\b(enrollment|tuition|discount|fee)\b/i],
              ['library', /\b(library|ebook|book|catalog)\b/i],
              ['auth', /\b(auth|login|signup|password|passkey|oauth)\b/i],
              ['api', /\b(api|endpoint|webhook)\b/i],
              ['frontend', /\b(frontend|react|inertia|ui|ux|css|tailwind)\b/i],
              ['docs', /\b(documentation|docs?|readme|guide|handbook)\b/i],
            ];
            let scope = existing?.[2]?.toLowerCase() || '';

            if (!scope) {
              scope = scopeRules.find(([, pattern]) => pattern.test(currentTitle))?.[0] || '';
            }
            if (!scope && allPathsMatch(/^\.github\//)) scope = 'actions';
            if (!scope && allPathsMatch(/^(docs\/|[^/]*\.md$)/)) scope = 'docs';
            if (!scope && anyPathMatches(/^scripts\/install\.(sh|ps1)$/)) scope = 'installer';
            if (!scope && anyPathMatches(/^(docker\/|compose\.)/)) scope = 'docker';

            let subject = currentTitle
              .replace(/^\s*(draft|wip)\s*[:\-]\s*/i, '')
              .replace(/^\[[^\]]+\]\s*/, '')
              .replace(
                /^(feat(?:ure)?|enhancement|fix|bug(?:fix)?|hotfix|perf(?:ormance)?|refactor|docs?|documentation|tests?|build|ci|chore|revert|style)(?:\([A-Za-z0-9._/-]+\))?!?\s*[:\-]\s*/i,
                '',
              )
              .trim()
              .replace(/[.\s]+$/, '');

            const redundantVerbs = {
              feat: /^(feat(?:ure)?|enhancement)\s+/i,
              fix: /^(fix(?:ed|es)?|bugfix|hotfix)\s+/i,
              docs: /^(docs?|documentation)\s+/i,
              test: /^(tests?|testing)\s+/i,
              ci: /^(ci\/cd|ci)\s+/i,
            };
            if (redundantVerbs[type]) {
              subject = subject.replace(redundantVerbs[type], '');
            }
            if (/^[A-Z][a-z]/.test(subject)) {
              subject = subject[0].toLowerCase() + subject.slice(1);
            }
            if (!subject) {
              subject = `update pull request ${pull.number}`;
            }

            const breaking =
              existing?.[3] === '!' ||
              hasAnyLabel('breaking') ||
              /\bbreaking change\b/i.test(`${currentTitle}\n${pull.body || ''}`);
            const prefix = `${type}${scope ? `(${scope})` : ''}${breaking ? '!' : ''}: `;
            const normalizedTitle = `${prefix}${subject.slice(0, 240 - prefix.length).trim()}`;

            if (normalizedTitle === currentTitle) {
              core.info('PR title is already normalized.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              title: normalizedTitle,
            });
            core.notice(`Updated PR title: ${currentTitle} -> ${normalizedTitle}`);
