services:
    traefik:
        image: "traefik:v3.3"
        command:
            - "--api.insecure=true"
            - "--providers.docker=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--providers.file.directory=/etc/traefik/dynamic"
            - "--providers.file.watch=true"
            - "--log.level=INFO"
        ports:
            - "80:80"
            - "443:443"
            - "8080:8080"
        networks:
            - sail
        volumes:
            - "./docker/traefik/dynamic:/etc/traefik/dynamic:ro,z"
            - "./docker/traefik/certs:/etc/traefik/certs:ro,z"
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: sail-8.5/app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: "/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80"
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html:z"
        networks:
            sail:
                aliases:
                    - laravel
        depends_on:
            - pgsql
            - redis
            - mailpit
            - meilisearch
    pgsql:
        image: "postgres:18-alpine"
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-password}"
            POSTGRES_DB: "${DB_DATABASE:-laravel}"
            POSTGRES_USER: "${DB_USERNAME:-sail}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - "sail-pgsql2:/var/lib/postgresql"
        networks:
            - sail
    redis:
        image: "redis:alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail
    station:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: sail-8.5/app
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html:z"
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        command:
            - /bin/bash
            - -lc
            - php artisan station:work redis --queue=default,assessments --workers=3 --memory=512 --timeout=60 --tries=1 & php artisan station:work redis-pdf --queue=pdf-generation --workers=2 --memory=2048 --timeout=3600 --tries=1 & php artisan queue:work "${ASSESSMENT_EXPORT_CONNECTION:-assessment-pdf}" --queue="${ASSESSMENT_EXPORT_QUEUE:-assessment-pdf}" --timeout="${ASSESSMENT_EXPORT_WORKER_TIMEOUT:-1900}" --memory="${ASSESSMENT_EXPORT_WORKER_MEMORY:-2048}" & php artisan queue:work "${ASSESSMENT_EXPORT_CONNECTION:-assessment-pdf}" --queue="${ASSESSMENT_EXPORT_EVENT_QUEUE:-assessment-events}" --timeout=60 --memory=256 & wait -n
    pulse:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: sail-8.5/app
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html:z"
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        command: ["/bin/bash", "-c", "php artisan pulse:check & php artisan pulse:work"]
    meilisearch:
        image: "getmeili/meilisearch:v1.48.2"
        ports:
            - "${FORWARD_MEILISEARCH_PORT:-7700}:7700"
        environment:
            MEILI_NO_ANALYTICS: "${MEILISEARCH_NO_ANALYTICS:-false}"
        volumes:
            - "sail-meilisearch:/meili_data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - "--no-verbose"
                - "--spider"
                - "http://127.0.0.1:7700/health"
            retries: 3
            timeout: 5s
    gotenberg:
        image: gotenberg/gotenberg:8
        networks:
            - sail
        ports:
            - "9888:3000"
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql2:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
