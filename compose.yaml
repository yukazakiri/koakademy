services:
    laravel.test:
        build:
            context: ./docker/dev
            dockerfile: Dockerfile
            args:
                WWWUSER: "${WWWUSER:-1000}"
                WWWGROUP: "${WWWGROUP:-1000}"
        image: koakademy-dev/php8.5
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-8000}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: "/usr/local/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
        networks:
            sail:
                aliases:
                    - laravel
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
            meilisearch:
                condition: service_healthy
            gotenberg:
                condition: service_started

    pgsql:
        image: "postgres:18-alpine"
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-password}"
            POSTGRES_DB: "${DB_DATABASE:-koakademy}"
            POSTGRES_USER: "${DB_USERNAME:-sail}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - "sail-pgsql:/var/lib/postgresql"
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            retries: 5
            timeout: 5s

    redis:
        image: "redis:8-alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 5
            timeout: 5s

    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail

    meilisearch:
        image: "getmeili/meilisearch:v1.48.2"
        ports:
            - "${FORWARD_MEILISEARCH_PORT:-7700}:7700"
        environment:
            MEILI_NO_ANALYTICS: "${MEILISEARCH_NO_ANALYTICS:-false}"
        volumes:
            - "sail-meilisearch:/meili_data"
        networks:
            - sail
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
            retries: 5
            timeout: 5s

    gotenberg:
        image: "gotenberg/gotenberg:8"
        ports:
            - "${FORWARD_GOTENBERG_PORT:-9888}:3000"
        networks:
            - sail

    horizon:
        profiles: ["workers"]
        build:
            context: ./docker/dev
            dockerfile: Dockerfile
            args:
                WWWUSER: "${WWWUSER:-1000}"
                WWWGROUP: "${WWWGROUP:-1000}"
        image: koakademy-dev/php8.5
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
        volumes:
            - ".:/var/www/html"
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["php", "artisan", "horizon"]

    pulse:
        profiles: ["workers"]
        build:
            context: ./docker/dev
            dockerfile: Dockerfile
            args:
                WWWUSER: "${WWWUSER:-1000}"
                WWWGROUP: "${WWWGROUP:-1000}"
        image: koakademy-dev/php8.5
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
        volumes:
            - ".:/var/www/html"
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["/bin/bash", "-c", "php artisan pulse:check & php artisan pulse:work"]

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
