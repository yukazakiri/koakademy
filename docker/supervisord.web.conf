[program:nginx]
command=/usr/sbin/nginx
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[supervisord]
nodaemon = true
user = root

[supervisorctl]

[inet_http_server]
port = 127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /etc/supervisor/conf.d/supervisord.horizon.conf /etc/supervisor/conf.d/supervisord.pulse.conf /etc/supervisor/conf.d/supervisord.nightwatch.conf
