[global]
error_log = /dev/stderr

[www]
user = laravel
group = laravel
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
; Recycle workers sooner. The PHP security advisory for CVE-2026-109619 needs
; the request that produced stale worker state and the request that consumes
; it to land on the same worker, so a shorter worker lifetime shrinks that
; window. PHP 8.5.12 resets the affected state, which is the actual fix.
pm.max_requests = 100
