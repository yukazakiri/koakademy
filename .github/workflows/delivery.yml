name: Delivery

run-name: Release / ${{ github.sha }}

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: delivery-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-automation
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create or update the reviewed release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish stable release
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: container-publishing
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact stable release
        id: release
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          [[ "${RELEASE_CREATED}" == 'true' ]] || {
            printf 'No stable release was created by Release Please.\n' >&2
            exit 1
          }
          tag="${RELEASE_TAG}"
          version="${RELEASE_VERSION}"
          source_sha="${RELEASE_SHA}"

          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Delivery requires an exact stable vX.Y.Z tag.\n' >&2
            exit 1
          }
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Delivery requires an exact stable X.Y.Z version.\n' >&2
            exit 1
          }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Delivery requires a full immutable source SHA.\n' >&2
            exit 1
          }
          [[ "$(git rev-parse "${tag}^{commit}")" == "${source_sha}" ]] || {
            printf 'The release tag does not resolve to the expected source commit.\n' >&2
            exit 1
          }
          [[ "$(jq --raw-output '.version' version.json)" == "${version}" ]] || {
            printf 'version.json does not match %s.\n' "${tag}" >&2
            exit 1
          }

          {
            printf 'tag=%s\n' "${tag}"
            printf 'version=%s\n' "${version}"
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate release image metadata
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/generate-version-metadata.sh \
            --channel stable \
            --version "${VERSION}" \
            --commit "${SOURCE_SHA}" \
            --image "${IMAGE}:sha-${SOURCE_SHA}" \
            --build-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Check immutable release tags
        id: existing
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          sha_ref="${IMAGE}:sha-${SOURCE_SHA}"
          release_ref="${IMAGE}:${RELEASE_TAG}"
          sha_digest="$(docker buildx imagetools inspect "${sha_ref}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          release_digest="$(docker buildx imagetools inspect "${release_ref}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"

          if [[ -z "${sha_digest}" && -z "${release_digest}" ]]; then
            printf 'build_required=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          [[ -n "${sha_digest}" && -n "${release_digest}" && "${sha_digest}" == "${release_digest}" ]] || {
            printf 'Immutable release tags already exist but do not resolve to one digest. Refusing to overwrite them.\n' >&2
            exit 1
          }

          printf 'build_required=false\n' >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${sha_digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push the immutable release image
        id: build
        if: steps.existing.outputs.build_required == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release,ignore-error=true

      - name: Verify the immutable release image
        id: image
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          digest="${BUILT_DIGEST:-${EXISTING_DIGEST}}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Buildx did not return an immutable image digest.\n' >&2
            exit 1
          }

          inspection="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}")"
          remote_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<<"${inspection}" | head -n 1)"
          [[ "${remote_digest}" == "${digest}" ]] || {
            printf 'The vX.Y.Z tag did not resolve to the built digest.\n' >&2
            exit 1
          }
          grep -Eq 'Platform:[[:space:]]*linux/amd64' <<<"${inspection}"
          grep -Eq 'Platform:[[:space:]]*linux/arm64' <<<"${inspection}"

          sha_inspection="$(docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}")"
          sha_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<<"${sha_inspection}" | head -n 1)"
          [[ "${sha_digest}" == "${digest}" ]] || {
            printf 'The immutable SHA tag did not resolve to the built digest.\n' >&2
            exit 1
          }

          metadata="$(docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}" --raw)"
          jq --exit-status '
            [.manifests[].platform.architecture] | index("amd64") != null and index("arm64") != null
          ' <<<"${metadata}" >/dev/null

          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the GHCR build
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Assemble checksummed installer bundle
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir release-assets
          cp compose.production.yaml .env.production.example scripts/install.sh \
            scripts/koakademy scripts/swarm-stack.yml scripts/Caddyfile \
            scripts/koakademy-app-entrypoint.sh release-assets/
          jq --arg image "${IMAGE}@${IMAGE_DIGEST}" '.image = $image' version.json \
            > release-assets/version.json
          (
            cd release-assets
            LC_ALL=C sha256sum .env.production.example compose.production.yaml \
              install.sh koakademy swarm-stack.yml Caddyfile \
              koakademy-app-entrypoint.sh version.json > SHA256SUMS
          )

      - name: Publish the GitHub Release and installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --verify-tag --draft \
              --title "KoAkademy ${RELEASE_TAG}" --generate-notes
          fi

          gh release upload "${RELEASE_TAG}" \
            release-assets/version.json \
            release-assets/compose.production.yaml \
            release-assets/.env.production.example \
            release-assets/install.sh \
            release-assets/koakademy \
            release-assets/swarm-stack.yml \
            release-assets/Caddyfile \
            release-assets/koakademy-app-entrypoint.sh \
            release-assets/SHA256SUMS \
            --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false --latest
