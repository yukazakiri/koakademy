[program:inertia-ssr]
command=/bin/sh -c 'if [ "${INERTIA_SSR_ENABLED:-true}" = "false" ] || [ "${INERTIA_SSR_ENABLED:-true}" = "0" ] || [ "${INERTIA_SSR_ENABLED:-true}" = "no" ] || [ "${INERTIA_SSR_ENABLED:-true}" = "off" ]; then exec tail -f /dev/null; fi; exec php artisan inertia:start-ssr --runtime="${INERTIA_SSR_RUNTIME:-node}"'
directory=/app
user=%(ENV_USER)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30
