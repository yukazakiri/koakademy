name: koakademy

services:
  app:
    image: ${KOAKADEMY_IMAGE:-ghcr.io/yukazakiri/koakademy:${KOAKADEMY_VERSION:?Set KOAKADEMY_VERSION to a stable FrankenPHP release tag (e.g. v1.30.0-franken)}}
    env_file:
      - ${KOAKADEMY_ENV_FILE:-.env}
    environment:
      HORIZON_IN_HTTP_CONTAINER: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  horizon:
    image: ${KOAKADEMY_IMAGE:-ghcr.io/yukazakiri/koakademy:${KOAKADEMY_VERSION:?Set KOAKADEMY_VERSION to a stable FrankenPHP release tag (e.g. v1.30.0-franken)}}
    env_file:
      - ${KOAKADEMY_ENV_FILE:-.env}
    environment:
      CONTAINER_MODE: horizon
      AUTO_MIGRATE: "false"
      RUN_DOCKER_SCRIPTS: "false"
      RUN_SCOUT_SETTINGS: "false"
      RUN_OPTIMIZE: "false"
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30m
    restart: unless-stopped

  scheduler:
    image: ${KOAKADEMY_IMAGE:-ghcr.io/yukazakiri/koakademy:${KOAKADEMY_VERSION:?Set KOAKADEMY_VERSION to a stable FrankenPHP release tag (e.g. v1.30.0-franken)}}
    env_file:
      - ${KOAKADEMY_ENV_FILE:-.env}
    environment:
      CONTAINER_MODE: scheduler
      AUTO_MIGRATE: "false"
      RUN_DOCKER_SCRIPTS: "false"
      RUN_SCOUT_SETTINGS: "false"
      RUN_OPTIMIZE: "false"
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-koakademy}
      POSTGRES_USER: ${DB_USERNAME:-koakademy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app-storage:
  postgres-data:
  redis-data:
