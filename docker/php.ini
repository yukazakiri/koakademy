[PHP]
post_max_size = 420M
upload_max_filesize = 400M
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
; Keep memory_limit above post_max_size. A request body that passes the
; post_max_size check but exceeds memory_limit forces an out-of-memory abort
; during request startup, which is the precondition for the OOM corruption
; remote code execution tracked as CVE-2026-109618.
memory_limit = 512M
max_input_time = 5
register_argc_argv = 0
date.timezone = ${TZ:-UTC}

; Bound the request surface so a hostile multipart body cannot amplify itself
; into the memory limit through nested fields or oversized headers.
max_input_vars = 1000
max_input_nesting_level = 32
max_file_uploads = 20

; PHP 8.5 runtime hardening for CVE-2026-109618 and CVE-2026-109619.
;
; fatal_error_backtraces publishes request-owned backtrace state to a worker
; global during shutdown. When the request heap is freed before that state is
; reset, a later request can read the stale pointer before normal request
; initialization replaces it. PHP 8.5.12 fixes the reset, and disabling the
; backtrace feature removes the confirmed producer on top of that.
fatal_error_backtraces = 0

; Session upload progress reaches session handling before ordinary request
; initialization, so it can consume session state left behind by an
; interrupted request. The application does not use the feature, so disable it
; and keep the early producer and consumer out of the request lifecycle.
session.upload_progress.enabled = 0

; Surface diagnostics instead of dropping them. The PHP security advisories
; for CVE-2026-109618 and CVE-2026-109619 both point at warning, deprecation
; and fatal output as the evidence needed to audit a deployment. display_errors
; stays off, so nothing is returned to the client.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.use_cwd = 0
opcache.save_comments = 1
opcache.max_file_size = 0
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
opcache.enable_file_override = 1
opcache.file_cache_consistency_checks = 0
opcache.file_cache = /tmp/opcache-file-cache
opcache.file_cache_ttl = 3600

[JIT]
opcache.jit_buffer_size = 128M
opcache.jit = tracing
opcache.jit_hot_loop = 16
opcache.jit_hot_func = 32
opcache.jit_hot_return = 4
opcache.jit_max_root_traces = 2048
opcache.jit_max_side_traces = 256
