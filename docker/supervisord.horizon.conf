[program:horizon]
process_name = %(program_name)s
command = php /app/artisan horizon
user = %(ENV_USER)s
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal = TERM
stopwaitsecs = 3600

[program:assessment-pdf]
process_name = %(program_name)s_%(process_num)02d
command = php /app/artisan queue:work %(ENV_ASSESSMENT_EXPORT_CONNECTION)s --queue=%(ENV_ASSESSMENT_EXPORT_QUEUE)s --sleep=1 --timeout=%(ENV_ASSESSMENT_EXPORT_WORKER_TIMEOUT)s --memory=%(ENV_ASSESSMENT_EXPORT_WORKER_MEMORY)s --max-time=3600
numprocs = %(ENV_ASSESSMENT_EXPORT_PROCESSES)s
user = %(ENV_USER)s
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal = TERM
stopwaitsecs = 1980

[program:assessment-events]
process_name = %(program_name)s_%(process_num)02d
command = php /app/artisan queue:work %(ENV_ASSESSMENT_EXPORT_CONNECTION)s --queue=%(ENV_ASSESSMENT_EXPORT_EVENT_QUEUE)s --sleep=1 --tries=3 --timeout=60 --memory=256 --max-time=3600
numprocs = %(ENV_ASSESSMENT_EXPORT_EVENT_PROCESSES)s
user = %(ENV_USER)s
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal = TERM
stopwaitsecs = 120

[include]
files = /etc/supervisord.conf
