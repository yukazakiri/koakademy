name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Application and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"
      SCOUT_DRIVER: collection
      PULSE_ENABLED: "false"
      TELESCOPE_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: mbstring, bcmath, pcntl, intl, gd, zip, sqlite3
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin shellcheck

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix docs ci

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Build application frontend
        run: npm run build

      - name: Run Pest suite
        run: php artisan test --parallel --compact

      - name: Check generated docs and local links
        run: npm run docs:check

      - name: Build Astro documentation
        run: npm --prefix docs run build

      - name: Validate production Compose file
        env:
          KOAKADEMY_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Check shell syntax
        run: |
          sh -n docker/start-container docker/healthcheck docker/pulse-process \
            docker/run-scripts.sh docker/run.sh docker/docker-scripts/*.sh
          bash -n scripts/install.sh scripts/generate-version-metadata.sh
          shellcheck scripts/install.sh scripts/generate-version-metadata.sh \
            tests/Fixtures/installer/docker tests/Fixtures/installer/curl

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate platform build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -version

      - name: Validate workflows with actionlint
        run: '"${RUNNER_TEMP}/actionlint"'

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.28.0"
          ZIZMOR_SHA256: e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${ZIZMOR_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor" --persona auditor --min-severity medium --format github .github/workflows'

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Validate normalized title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pattern = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+/;
            const attempts = 15;

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });

              if (pattern.test(pull.title)) {
                core.info(`Validated Conventional Commit PR title: ${pull.title}`);
                return;
              }

              if (attempt < attempts) {
                core.info(`Waiting for title normalization (${attempt}/${attempts}): ${pull.title}`);
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }

            core.setFailed(
              'PR title was not normalized. Expected a title such as feat(enrollments): add fee overrides.',
            );

  required:
    name: required
    if: always()
    needs:
      - validate
      - container
      - workflow-security
      - pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}

    steps:
      - name: Confirm all required jobs passed
        run: |
          if ! jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<<"${JOB_RESULTS}"; then
            printf 'One or more required CI jobs did not succeed.\n' >&2
            exit 1
          fi
