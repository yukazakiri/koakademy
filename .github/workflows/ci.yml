name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by Delivery
        required: true
        type: string

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_only: ${{ steps.classify.outputs.release_only }}

    steps:
      - name: Detect a trusted Release Please metadata update
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('release_only', 'false');

            if (context.eventName !== 'pull_request') {
              core.info('Delivery and manual CI dispatches always run the full validation suite.');
              return;
            }

            const pull = context.payload.pull_request;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const trustedReleaseBranch =
              pull.base.ref === 'master' &&
              pull.head.repo?.full_name === expectedRepository &&
              pull.head.ref.startsWith('release-please--branches--master--components--');

            if (!trustedReleaseBranch) {
              core.info('This is not a same-repository Release Please branch.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const allowedFiles = new Set([
              '.release-please-manifest.json',
              'CHANGELOG.md',
              'version.json',
            ]);
            const changedFiles = new Set(files.map((file) => file.filename));
            const releaseOnly =
              changedFiles.size === allowedFiles.size &&
              files.every((file) =>
                allowedFiles.has(file.filename) &&
                file.status === 'modified' &&
                !file.previous_filename
              );

            core.info(`Release metadata only: ${releaseOnly}`);
            core.setOutput('release_only', releaseOnly ? 'true' : 'false');

      - name: Check out release metadata
        if: steps.classify.outputs.release_only == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Release Please metadata
        if: steps.classify.outputs.release_only == 'true'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          manifest_version="$(jq --exit-status --raw-output '."."' .release-please-manifest.json)"
          tracked_version="$(jq --exit-status --raw-output '.version' version.json)"

          [[ "${manifest_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${manifest_version}" == "${tracked_version}" ]]
          [[ "${PULL_REQUEST_TITLE}" == "chore(release): release ${tracked_version}" ]]
          grep --fixed-strings --quiet "## [${tracked_version}]" CHANGELOG.md

  validate:
    name: Application and documentation
    if: needs.scope.outputs.release_only != 'true'
    needs:
      - scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"
      SCOUT_DRIVER: collection
      PULSE_ENABLED: "false"
      TELESCOPE_ENABLED: "false"
      NIGHTWATCH_ENABLED: "false"
      INERTIA_SSR_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # Pinned to the first release that carries the CVE-2026-109618 and
          # CVE-2026-109619 fixes. Do not widen this back to "8.5".
          php-version: "8.5.12"
          extensions: mbstring, bcmath, pcntl, intl, gd, zip, sqlite3
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin shellcheck

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Set up Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match the patched Node runtime in both production Dockerfiles.
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify patched runtime versions
        run: |
          php -r 'version_compare(PHP_VERSION, "8.5.12", ">=") || exit(fprintf(STDERR, "PHP %s is vulnerable to CVE-2026-109618 and CVE-2026-109619; 8.5.12 or newer is required.\n", PHP_VERSION));'
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); if (a*1e6+b*1e3+c < 26*1e6+12*1e3+1) { console.error("Node " + process.versions.node + " is missing the October 2026 security fixes; 26.12.1 or newer is required."); process.exit(1); }'
          php -v | head -1
          node --version

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --abandoned=report

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript production dependencies
        run: bash scripts/audit-production-deps.sh

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run JavaScript unit tests
        run: |
          npm run test:email-canvas
          npm run test:enrollment-workflow
          npm run test:grade-status-labels
          node --test tests/Unit/scheduling-readiness.test.mjs
          node --test tests/Unit/weekly-schedule.test.mjs

      - name: Exercise stable and edge installer fixtures
        run: |
          bash tests/installer-release.sh stable
          bash tests/installer-release.sh edge

      - name: Build application frontend
        run: npm run build

      - name: Run Pest suite
        run: php artisan test --parallel --compact

      - name: Check generated docs and local links
        run: npm run docs:check

      - name: Validate production Compose file
        env:
          KOAKADEMY_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Check shell syntax
        run: |
          for script in docker/start-container docker/healthcheck docker/pulse-process \
            docker/nightwatch-process docker/run-scripts.sh docker/docker-scripts/*.sh; do
            sh -n "${script}"
          done
          for script in scripts/install.sh scripts/koakademy scripts/check-release-assets.sh \
            scripts/generate-version-metadata.sh scripts/audit-production-deps.sh \
            tests/installer-release.sh; do
            bash -n "${script}"
          done
          shellcheck scripts/install.sh scripts/koakademy scripts/koakademy-app-entrypoint.sh \
            scripts/check-release-assets.sh scripts/generate-version-metadata.sh \
            scripts/audit-production-deps.sh tests/installer-release.sh \
            tests/Fixtures/installer/docker tests/Fixtures/installer/curl

      - name: Validate one-line Swarm stack
        run: |
          docker compose --env-file tests/Fixtures/installer/swarm-stack.env \
            -f scripts/swarm-stack.yml config --quiet
          docker compose --env-file tests/Fixtures/installer/swarm-stack.env \
            -f scripts/swarm-stack-direct.yml config --quiet
          set -a
          source tests/Fixtures/installer/swarm-stack.env
          set +a
          docker stack config --compose-file scripts/swarm-stack.yml >/dev/null
          docker stack config --compose-file scripts/swarm-stack-direct.yml >/dev/null

  workflow-security:
    name: Workflow security
    if: needs.scope.outputs.release_only != 'true'
    needs:
      - scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Recovery validates the workflow that runs, not an old tag's workflows.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Test required-check policy
        run: |
          bash -n tests/ci-required.sh
          sh -n tests/Fixtures/installer/ss
          bash tests/ci-required.sh

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -version

      - name: Validate workflows with actionlint
        run: '"${RUNNER_TEMP}/actionlint"'

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.28.0"
          ZIZMOR_SHA256: e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${ZIZMOR_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor" --persona auditor --min-severity medium --format github .github/workflows'

  docs:
    name: Documentation production build
    if: needs.scope.outputs.release_only != 'true'
    needs:
      - scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up documentation runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep the documentation toolchain on its patched Node 22 runtime.
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci

      - name: Check generated docs and local links
        run: npm --prefix .. run docs:check

      - name: Build Astro site
        run: npm run build

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Validate normalized title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pattern = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+/;
            const attempts = 15;

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });

              if (pattern.test(pull.title)) {
                core.info(`Validated Conventional Commit PR title: ${pull.title}`);
                return;
              }

              if (attempt < attempts) {
                core.info(`Waiting for title normalization (${attempt}/${attempts}): ${pull.title}`);
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }

            core.setFailed(
              'PR title was not normalized. Expected a title such as feat(enrollments): add fee overrides.',
            );

  required:
    name: required
    if: always()
    needs:
      - scope
      - validate
      - workflow-security
      - docs
      - pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      CI_EVENT_NAME: ${{ github.event_name }}
      RELEASE_ONLY: ${{ needs.scope.outputs.release_only }}

    steps:
      - name: Check out required-check policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Confirm all required jobs passed
        run: |
          if ! jq --exit-status \
            --arg event_name "${CI_EVENT_NAME}" \
            --arg release_only "${RELEASE_ONLY}" \
            --from-file .github/ci-required.jq <<<"${JOB_RESULTS}"; then
            printf 'One or more required CI jobs did not succeed.\n' >&2
            exit 1
          fi
