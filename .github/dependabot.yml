version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - php
    # KoAkademy modules are released and deployed together with the app.
    # Do not apply Dependabot's default three-day version cooldown to them.
    cooldown:
      exclude:
        - "koakademy/*"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Group all first-party koakademy modules into a single PR for unified delivery.
      koakademy-modules:
        patterns:
          - "koakademy/*"
      # Group all third-party patch and minor bumps into one PR per week.
      composer-patch:
        update-types:
          - "patch"
        exclude-patterns:
          - "koakademy/*"
      composer-minor:
        update-types:
          - "minor"
        exclude-patterns:
          - "koakademy/*"
      composer-major:
        update-types:
          - "major"
        exclude-patterns:
          - "koakademy/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Etc/UTC
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-base-images:
        patterns:
          - "*"