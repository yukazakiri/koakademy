name: Project Roadmap Automation

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions: {}

env:
  PROJECT_URL: https://github.com/users/yukazakiri/projects/4
  PROJECT_ID: PVT_kwHOB67-Yc4BVOBS
  STATUS_FIELD_ID: PVTSSF_lAHOB67-Yc4BVOBSzhQrWBk
  STATUS_TODO_OPTION_ID: f75ad846
  STATUS_IN_PROGRESS_OPTION_ID: 47fc9ee4
  STATUS_DONE_OPTION_ID: 98236657

jobs:
  credentials:
    name: Validate roadmap credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: roadmap-automation
    permissions: {}
    outputs:
      available: ${{ steps.preflight.outputs.available }}

    steps:
      - name: Check project token access
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TOKEN_PRESENT: ${{ secrets.PROJECT_AUTOMATION_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || github.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            core.setOutput('available', 'false');

            if (process.env.TOKEN_PRESENT !== 'true') {
              core.warning(
                'Roadmap automation is skipped because PROJECT_AUTOMATION_TOKEN is missing. ' +
                'Add a token with read/write access to the user project to restore synchronization.',
              );
              return;
            }

            try {
              const result = await github.graphql(
                `query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 { id }
                  }
                }`,
                { projectId },
              );

              if (result.node?.id !== projectId) {
                core.warning(
                  'Roadmap automation is skipped because PROJECT_AUTOMATION_TOKEN cannot access the configured project.',
                );
                return;
              }

              core.setOutput('available', 'true');
            } catch (error) {
              const status = Number(error.status ?? error.response?.status ?? 0);
              if ([401, 403, 404].includes(status)) {
                core.warning(
                  `Roadmap automation is skipped because PROJECT_AUTOMATION_TOKEN cannot access the configured project (HTTP ${status}). ` +
                  'Replace the token to restore synchronization.',
                );
                return;
              }

              throw error;
            }

  add-issue-to-project:
    needs:
      - credentials
    if: >-
      needs.credentials.outputs.available == 'true' &&
      github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: roadmap-automation
    permissions: {}
    steps:
      - name: Add issue to roadmap project
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}

      - name: Set issue status to Todo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const fieldId = process.env.STATUS_FIELD_ID;
            const todoOptionId = process.env.STATUS_TODO_OPTION_ID;
            const issueNodeId = context.payload.issue.node_id;

            const findProjectItem = async (contentId) => {
              let cursor = null;

              do {
                const result = await github.graphql(
                  `query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue { id }
                        }
                      }
                    }
                  }
                }
                  }`,
                  { projectId, cursor },
                );
                const items = result.node.items;
                const match = items.nodes.find((item) => item.content?.id === contentId);
                if (match) return match.id;
                cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
              } while (cursor);

              return null;
            };

            let projectItemId = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              projectItemId = await findProjectItem(issueNodeId);
              if (projectItemId) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }

            if (!projectItemId) {
              core.setFailed('Issue was not found in project after retries.');
              return;
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId,
                itemId: projectItemId,
                fieldId,
                optionId: todoOptionId,
              },
            );

  add-pr-to-project:
    needs:
      - credentials
    if: >-
      needs.credentials.outputs.available == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: roadmap-automation
    permissions: {}
    steps:
      - name: Add PR to roadmap project
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}

  update-pr-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: roadmap-automation
    permissions: {}
    needs:
      - credentials
      - add-pr-to-project
    if: >-
      always() &&
      needs.credentials.outputs.available == 'true' &&
      github.event_name == 'pull_request'
    steps:
      - name: Set PR status in roadmap project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const fieldId = process.env.STATUS_FIELD_ID;
            const todoOptionId = process.env.STATUS_TODO_OPTION_ID;
            const inProgressOptionId = process.env.STATUS_IN_PROGRESS_OPTION_ID;
            const doneOptionId = process.env.STATUS_DONE_OPTION_ID;

            const prNodeId = context.payload.pull_request.node_id;
            const action = context.payload.action;
            const isDraft = context.payload.pull_request.draft;

            let targetOptionId = inProgressOptionId;
            if (action === 'closed') {
              targetOptionId = doneOptionId;
            } else if (isDraft || action === 'converted_to_draft') {
              targetOptionId = todoOptionId;
            }

            const findProjectItem = async (contentId) => {
              let cursor = null;

              do {
                const result = await github.graphql(
                  `query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on PullRequest { id }
                        }
                      }
                    }
                  }
                }
                  }`,
                  { projectId, cursor },
                );
                const items = result.node.items;
                const match = items.nodes.find((item) => item.content?.id === prNodeId);
                if (match) return match.id;
                cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
              } while (cursor);

              return null;
            };

            let projectItemId = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              projectItemId = await findProjectItem(prNodeId);
              if (projectItemId) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }

            if (!projectItemId) {
              core.setFailed('Pull request was not found in project after retries.');
              return;
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId,
                itemId: projectItemId,
                fieldId,
                optionId: targetOptionId,
              },
            );
